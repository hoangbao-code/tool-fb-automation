name: Build & Release CHDV Post Manager v2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare environment for CI
        run: |
          chmod +x gradlew
          sed -i '/org.gradle.java.home/d' gradle.properties || true

      - name: Run Unit Tests (NLP & Corpus)
        run: ./gradlew test --stacktrace

      - name: Build Debug & Signed Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHDV-Post-Manager-v2-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHDV-Post-Manager-v2-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "CHDV Post Manager v2.0.0"
          body: |
            ## 🏢 Bản phát hành CHDV Post Manager v2.0.0
            
            - **Bản APK chính thức (Đã ký số v1, v2, v3 scheme)**: Tải file `app-release.apk` bên dưới để cài trực tiếp trên điện thoại Android.
            - **An toàn 100%**: Không lưu cookie FB, không quét ngầm mbasic.
            - **Bóc tách thông minh**: Bóc tách loại phòng, giá, diện tích, vị trí và lọc sạch 100% hoa hồng môi giới.
            - **Hỗ trợ phiên đăng bài**: Chia sẻ ảnh + caption tự động sang ứng dụng Facebook chính thức.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
