name: Build & Publish Tagged Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a679e843a61ab97dd01e9c379c8" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests
        run: gradle test --console=plain --stacktrace

      - name: Assemble Release APK
        run: gradle assembleRelease --console=plain --stacktrace

      - name: Publish Official Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Jammy_post_hub ${{ github.ref_name }}"
          body: |
            ## 🌟 Bản phát hành chính thức Jammy_post_hub ${{ github.ref_name }}
            - Phiên bản: `${{ github.ref_name }}`
            - Tải file `app-release.apk` hoặc `app-debug.apk` để cài đặt.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
