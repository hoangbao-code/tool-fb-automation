name: Build & Deploy Nightly APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a679e843a61ab97dd01e9c379c8" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests
        run: gradle test --console=plain --info --stacktrace

      - name: Assemble Debug APK
        run: gradle assembleDebug --console=plain --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jammy_post_hub-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Update Nightly Pre-release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Jammy_post_hub Nightly (Build #${{ github.run_number }})"
          body: |
            ## 🚀 Bản build tự động Jammy_post_hub (Nightly)
            - **Mã bản build (Run Number)**: `#${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Hướng dẫn cài đặt**: Tải file `app-debug.apk` bên dưới về điện thoại và bấm cài đặt (có thể cài đè trực tiếp mà không cần gỡ app cũ nhờ khóa `dev.jks` cố định).
          draft: false
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
