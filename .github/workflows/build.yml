name: Build & Test PostHub Suite

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test_pc:
    name: Test PostHub PC Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Verify JavaScript Syntax
        run: |
          node -c src/main.js
          node -c src/db.js
          node -c src/services/fbEngine.js
          node -c src/services/zaloEngine.js
          node -c src/services/gemini.js

      - name: Run Automated Test Suite
        run: npm test

  build_android:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a679e843a61ab97dd01e9c379c8" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Android Unit Tests
        run: |
          set -o pipefail
          gradle test --console=plain --stacktrace 2>&1 | tee build.log || {
            ERR_MSG=$(grep -E "^e: " build.log | head -n 10 | tr '\r\n' '  ' | sed 's/::/%3A%3A/g')
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(grep -B 2 -A 5 -E "error:|Compilation error|FAILURE:" build.log | head -n 30 | tr '\r\n' '  ' | sed 's/::/%3A%3A/g')
            fi
            echo "::error title=Build Failure::$ERR_MSG"
            exit 1
          }

      - name: Assemble Debug APK
        run: gradle assembleDebug --console=plain --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PostHub-Android-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
