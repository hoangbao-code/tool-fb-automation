name: Build & Test PostHub PC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test PostHub PC Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Verify JavaScript Syntax
        run: |
          node -c src/main.js
          node -c src/db.js
          node -c src/services/fbEngine.js
          node -c src/services/zaloEngine.js
          node -c src/services/gemini.js

      - name: Run Automated Test Suite
        run: npm test
